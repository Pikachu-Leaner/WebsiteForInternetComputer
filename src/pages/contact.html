<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Contact - JS Boilerplate</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/custom.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="../index.html">JS Boilerplate</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h1 class="display-4 mb-4">Contact Us</h1>

          <form id="contactForm" class="mt-4">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" required />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required />
            </div>

            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>

          <div id="formResult" class="mt-3"></div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5 fixed-bottom">
      <div class="container">
        <p class="mb-0">&copy; 2026 JS Boilerplate. All rights reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import ApiService from '../js/api.js';

      document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          message: document.getElementById('message').value,
        };

        const resultDiv = document.getElementById('formResult');
        resultDiv.innerHTML = '<div class="alert alert-info">Sending...</div>';

        try {
          // Ví dụ: Gửi form data đến API
          // const response = await ApiService.post('/contact', formData);
          // resultDiv.innerHTML = '<div class="alert alert-success">Message sent successfully!</div>';

          // Demo chỉ log ra console
          console.log('Form data:', formData);
          resultDiv.innerHTML =
            '<div class="alert alert-success">Message sent successfully! (Demo)</div>';

          // Reset form
          document.getElementById('contactForm').reset();
        } catch (error) {
          resultDiv.innerHTML =
            '<div class="alert alert-danger">Error: ' + error.message + '</div>';
        }
      });
    </script>
  </body>
</html>
