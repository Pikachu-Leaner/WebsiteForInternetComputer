    <!-- Axios (nếu muốn dùng CDN thay vì npm) -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script> -->

    <!-- Main JS (sử dụng module type để import) -->
    <script type="module" src="./js/main.js"></script>

    <!-- Example API calls -->
    <script type="module">
      import ApiService from './js/api.js';

      // Global functions để test API
      window.testAPI = async function () {
        const responseDiv = document.getElementById('apiResponse');
        try {
          responseDiv.textContent = 'Loading...';
          const data = await ApiService.get('https://jsonplaceholder.typicode.com/posts/1');
          responseDiv.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          responseDiv.textContent = 'Error: ' + error.message;
        }
      };

      window.testFetch = async function () {
        const responseDiv = document.getElementById('apiResponse');
        try {
          responseDiv.textContent = 'Loading...';
          const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
          const data = await response.json();
          responseDiv.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          responseDiv.textContent = 'Error: ' + error.message;
        }
      };

      window.loadUsers = async function () {
        const responseDiv = document.getElementById('apiResponse');
        try {
          responseDiv.textContent = 'Loading users...';
          const data = await ApiService.get('https://jsonplaceholder.typicode.com/users');
          responseDiv.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          responseDiv.textContent = 'Error: ' + error.message;
        }
      };
    </script>
